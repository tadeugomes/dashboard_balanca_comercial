# Mostra os logs do app publicado no shinyapps.io, sob demanda.
#
# Existe porque um app pode subir e depois morrer durante o uso — e o log do
# deploy, que termina em sucesso, não diz nada sobre isso. Sem este workflow o
# diagnóstico depende do painel web do shinyapps.io.
#
# Não publica nada, não toca nos dados: só lê logs.
name: Diagnóstico do app publicado

on:
  workflow_dispatch:
    inputs:
      linhas:
        description: 'Quantas linhas de log buscar'
        type: string
        default: '300'

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      # Só o rsconnect é necessário — não vale restaurar o renv inteiro para ler
      # logs, que levaria vários minutos.
      - name: Instalar rsconnect
        run: install.packages("rsconnect")
        shell: Rscript {0}

      - name: Buscar os logs do app
        env:
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          LINHAS: ${{ inputs.linhas }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = "observatorioportuario",
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::showLogs(
              appPath = ".",
              appName = "balanca_comercial",
              account = "observatorioportuario",
              entries = as.integer(Sys.getenv("LINHAS", "300"))
            )
          '
