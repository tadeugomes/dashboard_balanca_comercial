name: Atualizar dados do Comex Stat

on:
  schedule:
    # Dia 10 de cada mês, 09:00 UTC (06:00 em Brasília). O MDIC não publica em
    # dia fixo; quando nada mudou o job encerra em segundos.
    - cron: '0 9 10 * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Reprocessar todos os anos, ignorando o cache'
        type: boolean
        default: false

# Sem gatilho de pull_request: o repositório é público e um PR vindo de um
# fork não pode ter acesso aos secrets de deploy (SHINYAPPS_TOKEN/SECRET).

permissions:
  contents: write
  issues: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # Generoso: a primeira execução (ou uma reprocessando tudo com `forcar`)
    # baixa ~4 GB de um servidor lento que derruba conexões com frequência.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Mesma versão travada em renv.lock (campo R.Version).
          r-version: '4.4.1'
          use-public-rspm: true

      # O passo de deploy (rsconnect::deployDoc) chama internamente
      # quartoInspect() para inspecionar dashboard.qmd antes de empacotar o
      # bundle -- e para isso precisa do binário `quarto` no PATH, que o
      # runner não tem por padrão (só R e os pacotes do renv.lock). Sem este
      # passo, o deploy falha com "`quarto` not found."
      #
      # Versão travada em 1.5.57 (não "latest"): é a mesma registrada em
      # rsconnect/.../balanca_comercial.dcf (quarto_version), a versão com
      # que o app foi publicado da última vez com sucesso. O shinyapps.io
      # renderiza o documento do lado dele -- a versão local do Quarto
      # afeta só a inspeção e o empacotamento feitos por rsconnect aqui no
      # runner, não a renderização final. Como este job roda uma vez por
      # mês sem supervisão, reprodutibilidade pesa mais do que ganhar
      # correções automáticas: uma mudança de formato de bundle entre
      # versões do Quarto quebraria o deploy silenciosamente, numa hora em
      # que ninguém está olhando. Para atualizar o Quarto de propósito,
      # suba este número junto com um teste manual do deploy.
      #
      # Colocado logo após o setup-r, com os demais passos de preparação de
      # ambiente: o custo é baixo (poucos segundos) e assim, se a instalação
      # do Quarto falhar, o job falha cedo -- antes de gastar tempo com ETL
      # e download de ~4 GB -- em vez de falhar só no fim, no deploy.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.57'

      # setup-renv (próximo passo) instala os PACOTES R do lockfile, mas não
      # as bibliotecas de sistema (C/C++) de que as extensões nativas deles
      # dependem. Sem isso, setup-renv falha tentando compilar/carregar
      # `igraph` (faltando libglpk.so.40 — foi o que derrubou a primeira
      # execução real deste workflow). Mapeamento lib -> pacote(s) R do
      # renv.lock que a exigem:
      #   libglpk-dev                                -> igraph (dep. transitiva de leaflet/golem)
      #   libgdal-dev libproj-dev libgeos-dev
      #     libudunits2-dev                          -> terra, raster, sp (pilha espacial dos mapas do leaflet)
      #   libxml2-dev                                -> XML
      #   libssl-dev                                 -> openssl
      #   libcurl4-openssl-dev                       -> curl (também usado diretamente pelo ETL em etl/R/baixar.R)
      #   libpng-dev                                 -> png
      #   libfontconfig1-dev libharfbuzz-dev
      #     libfribidi-dev                           -> trio padrão de shaping de texto exigido para compilar
      #                                                  pacotes gráficos com suporte a fontes a partir do
      #                                                  código-fonte, quando o binário do RSPM não cobre a
      #                                                  combinação de versões
      # GDAL e companhia são pesados e podem somar vários minutos ao job.
      # Aceitável: o job roda uma vez por mês e tem 180 min de timeout. Não
      # remova libs desta lista para "otimizar" sem ter certeza de que
      # nenhum pacote do lockfile ainda precisa delas.
      - name: Instalar dependências de sistema dos pacotes R
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglpk-dev \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev \
            libxml2-dev \
            libssl-dev libcurl4-openssl-dev \
            libpng-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev

      - uses: r-lib/actions/setup-renv@v2

      # Cache dos parquets anuais já convertidos (etl/.trabalho/anos). A
      # chave usa o hash do estado.json vigente no checkout; restore-keys
      # por prefixo permite reaproveitar um cache de uma chave anterior
      # quando não há correspondência exata.
      - name: Restaurar cache dos parquets anuais
        uses: actions/cache@v4
        with:
          path: etl/.trabalho/anos
          key: comex-anos-${{ hashFiles('etl/estado.json') }}
          restore-keys: |
            comex-anos-

      # Roda antes do ETL: não faz sentido processar ~4 GB de dados se a
      # suíte já está quebrada. 98 asserções.
      - name: Executar os testes
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      # O servidor do MDIC (balanca.economia.gov.br) não envia o certificado
      # intermediário na negociação TLS -- só o certificado-folha. O macOS
      # tolera isso porque busca o intermediário sozinho pelo campo AIA do
      # certificado do servidor; o curl no Linux (runner do Actions) não faz
      # essa busca, e todo download do ETL falha com "unable to get local
      # issuer certificate". É por isso que o pipeline sempre funcionou
      # localmente e nunca no CI. NÃO REMOVA este passo achando que é
      # supérfluo -- sem ele, `etl/run.R` falha na primeira consulta de
      # metadados remotos, antes mesmo de baixar qualquer CSV.
      #
      # Em vez de fixar a URL do intermediário, extrai a URL do próprio
      # campo AIA do certificado apresentado pelo servidor: sobrevive a uma
      # troca de certificado pelo SERPRO sem exigir editar este workflow.
      # Se a extração ou o download falharem por qualquer motivo, cai para
      # a URL fixa do intermediário observado nesta correção (Sectigo
      # Public Server Authentication CA OV R36) como último recurso.
      #
      # NÃO desabilita verificação de certificado em lugar nenhum (nada de
      # -k/--insecure/ssl_verifypeer=FALSE): o pipeline baixa dados públicos
      # de uma fonte oficial, e desligar a verificação abriria caminho para
      # um intermediário malicioso servir dados falsos -- a validação de
      # conteúdo do ETL não detectaria um CSV bem formado com números
      # errados. Por isso o passo falha explicitamente (exit 1) se, depois
      # de instalar o intermediário, a cadeia ainda não validar.
      - name: Instalar certificado intermediário do servidor do MDIC
        run: |
          set +e   # Controlamos os erros manualmente abaixo -- o default do
                   # Actions (bash -e -o pipefail) tornaria a extração
                   # OPCIONAL do AIA (que pode legitimamente não achar nada)
                   # uma falha fatal do passo, o que não é o que queremos:
                   # nesse caso, a intenção é cair para a URL fixa.

          HOST="balanca.economia.gov.br"
          FALLBACK_URL="http://crt.sectigo.com/SectigoPublicServerAuthenticationCAOVR36.crt"

          AIA_URL="$(echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null \
            | openssl x509 -noout -text 2>/dev/null \
            | grep "CA Issuers" \
            | grep -oE 'http[^[:space:]]+' \
            | head -1)"

          if [ -n "$AIA_URL" ]; then
            echo "Intermediário anunciado pelo AIA do certificado do servidor: $AIA_URL"
            ORIGEM="$AIA_URL"
          else
            echo "Não foi possível extrair a URL do AIA; usando a URL fixa conhecida."
            ORIGEM="$FALLBACK_URL"
          fi

          baixar_e_validar() {
            curl -fsSL --retry 3 "$1" -o /tmp/intermediario.crt || return 1
            # O AIA normalmente serve o certificado em DER; se a conversão
            # falhar, assume que já veio em PEM.
            openssl x509 -inform DER -in /tmp/intermediario.crt -out /tmp/intermediario.pem 2>/dev/null \
              || cp /tmp/intermediario.crt /tmp/intermediario.pem
            # Confirma que é mesmo um certificado antes de instalar no
            # armazém de CAs do sistema.
            openssl x509 -noout -in /tmp/intermediario.pem 2>/dev/null
          }

          if ! baixar_e_validar "$ORIGEM"; then
            echo "Download/validação de '$ORIGEM' falhou; tentando a URL fixa como último recurso."
            if [ "$ORIGEM" = "$FALLBACK_URL" ] || ! baixar_e_validar "$FALLBACK_URL"; then
              echo "ERRO: não foi possível obter um certificado intermediário válido." >&2
              exit 1
            fi
          fi

          sudo cp /tmp/intermediario.pem /usr/local/share/ca-certificates/mdic-intermediario.crt || exit 1
          sudo update-ca-certificates || exit 1

          VERIFY="$(echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null | grep "Verify return code")"
          echo "$VERIFY"
          case "$VERIFY" in
            *"Verify return code: 0"*) echo "Cadeia de certificados validada." ;;
            *)
              echo "ERRO: a cadeia de certificados do MDIC ainda não valida depois de instalar o intermediário." >&2
              exit 1
              ;;
          esac

      - name: Executar o ETL
        run: |
          if [ "${{ inputs.forcar }}" = "true" ]; then
            Rscript etl/run.R --forcar
          else
            Rscript etl/run.R
          fi

      # etl/estado.json é o único artefato versionado do pipeline (os
      # parquets em dados/ não são — ver .gitignore). Publicar só faz
      # sentido quando ele de fato mudou.
      - name: Verificar se houve atualização
        id: mudou
        run: |
          if git diff --quiet etl/estado.json; then
            echo "houve=false" >> "$GITHUB_OUTPUT"
            echo "Nada mudou na fonte; nada a publicar."
          else
            echo "houve=true" >> "$GITHUB_OUTPUT"
          fi

      # Os parquets não são versionados; a Release é o canal de distribuição
      # deles. Se a Release da tag do mês já existir (reexecução manual no
      # mesmo mês, ou retentativa após uma falha nesta mesma corrida — ver
      # nota abaixo sobre a ordem dos passos), gh release create falha —
      # nesse caso, envia os arquivos para a Release já existente com
      # --clobber.
      # O shinyapps.io NÃO renderiza documentos Quarto Shiny no servidor
      # ("Content pre-render disabled for Shiny Quarto content"): ele exige o
      # HTML pré-renderizado no bundle e aborta com "Prerendered HTML file not
      # found" se ele faltar.
      #
      # Renderizar AQUI, depois do ETL e antes de publicar, é o que garante que
      # o HTML enviado corresponda ao dashboard.qmd atual E aos dados recém
      # gerados. Um HTML defasado no repositório congelaria títulos e IDs de
      # output no estado antigo -- foi o que quebrou a publicação de 06/08/2026,
      # com os painéis vazios porque a interface pedia balanca_2014_2024
      # enquanto o servidor oferecia balanca_anual.
      - name: Renderizar o dashboard
        if: success() && steps.mudou.outputs.houve == 'true'
        run: |
          quarto render dashboard.qmd
          echo "--- conferindo que o HTML reflete o código atual ---"
          if grep -q "balanca_2014_2024\|tabela_Exp_Prod2024" dashboard.html; then
            echo "ERRO: o HTML gerado ainda contém identificadores antigos."
            exit 1
          fi
          grep -o "balanca_anual" dashboard.html | head -1
          echo "HTML renderizado a partir do dashboard.qmd atual."

      - name: Publicar os parquets como asset de Release
        if: success() && steps.mudou.outputs.houve == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dados-$(date +%Y-%m)"
          gh release create "$TAG" \
            --title "Dados do Comex Stat — $(date +%Y-%m)" \
            --notes "Gerado automaticamente pelo pipeline mensal." \
            dados/ncm_exportacao_agrupado.parquet \
            dados/ncm_importacao_agrupado.parquet \
          || gh release upload "$TAG" \
            dados/ncm_exportacao_agrupado.parquet \
            dados/ncm_importacao_agrupado.parquet --clobber

      # O pipeline grava os parquets diretamente em dados/, então basta não
      # apagá-los antes do deploy — dashboard.qmd os lê de lá.
      - name: Publicar no shinyapps.io
        if: success() && steps.mudou.outputs.houve == 'true'
        env:
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = "observatorioportuario",
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployDoc(
              "dashboard.qmd",
              appName = "balanca_comercial",
              account = "observatorioportuario",
              forceUpdate = TRUE,
              logLevel = "verbose"
            )
          '

      # Captura os logs do app recém-publicado. Sem isto, um app que sobe mas
      # falha ao iniciar só pode ser diagnosticado pelo painel web do
      # shinyapps.io -- foi o que aconteceu em 06/08/2026, quando o app passou
      # a devolver "The application failed to start. exit status 1" e o log do
      # deploy, que termina em sucesso, não dizia nada sobre a causa.
      # continue-on-error: o diagnóstico não pode derrubar uma publicação boa.
      - name: Registrar logs do app publicado
        if: always() && steps.mudou.outputs.houve == 'true'
        continue-on-error: true
        env:
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = "observatorioportuario",
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            try(rsconnect::showLogs(
              appPath   = ".",
              appName   = "balanca_comercial",
              account   = "observatorioportuario",
              entries   = 200
            ))
          '

      # ÚLTIMO passo do caminho feliz — de propósito. Se Release ou deploy
      # falharem, este passo não pode rodar: registrar "já processado" antes
      # de terminar de publicar faria precisa_atualizar() concluir "nada
      # mudou" na próxima execução, e o deploy pendente nunca seria
      # retentado sozinho. `success()` explícito (redundante com o default
      # do Actions, mas deixado à vista): uma falha em qualquer passo
      # anterior pula este commit.
      - name: Registrar o estado no repositório
        if: success() && steps.mudou.outputs.houve == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add etl/estado.json
          git commit -m "chore: atualiza dados do Comex Stat [skip ci]"
          git push

      # Sem --label: `gh issue create --label "automação"` falhava porque
      # essa label não existe no repositório (nada a "corrigir" na
      # automação, é um recurso do repositório). Criar a label antes (`gh
      # label create ... || true`) resolveria, mas adicionaria mais uma
      # chamada de API e mais uma coisa para manter em sincronia com o
      # repositório; como rotular a issue não é essencial para o alerta
      # cumprir sua função, a alternativa mais simples é não depender de
      # label nenhuma.
      - name: Abrir issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Falha na atualização mensal do Comex Stat" \
            --body "A execução de $(date +%Y-%m-%d) falhou.

          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          O commit de etl/estado.json só acontece depois da Release e do
          deploy no shinyapps.io (nessa ordem, de propósito): se a falha foi
          ANTES da publicação, o estado não avançou e o dashboard em
          produção segue com os dados válidos do mês anterior — a próxima
          execução agendada tenta de novo sozinha, sem ação manual.

          Se a falha foi DEPOIS de Release/deploy terem rodado (por exemplo,
          o deploy no shinyapps.io falhou sozinho), o estado.json também não
          foi commitado, então a próxima execução agendada já vai
          reprocessar e tentar publicar de novo por conta própria — mas até
          o dia 10 do mês que vem isso não vai acontecer. Para não esperar,
          dispare manualmente agora:

            gh workflow run atualizar-dados.yml -R ${{ github.repository }}

          Isso reprocessa só o que ainda não foi confirmado (mesmo
          comportamento da execução agendada). Use -f forcar=true só se
          quiser ignorar o cache e reprocessar todos os anos do zero:

            gh workflow run atualizar-dados.yml -R ${{ github.repository }} -f forcar=true

          Confira o log acima antes de disparar de novo, para não repetir
          uma falha de causa raiz não corrigida (ex.: token do shinyapps.io
          inválido)."
